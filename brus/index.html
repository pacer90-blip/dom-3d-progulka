<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Дом из финского бруса — 3D прогулка</title>
<style>
  :root { --ink: #1d2126; --panel: rgba(20, 23, 28, 0.78); --text: #f2f2f0; --accent: #e4572e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8e0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: var(--text); }
  #hud > * { pointer-events: auto; }
  #room { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 6px 14px; border-radius: 999px; font-size: 15px; pointer-events: none; }
  #help { position: fixed; left: 16px; bottom: 16px; background: var(--panel); padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; max-width: 260px; }
  #help b { color: #fff; }
  #start { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  #mini { position: fixed; right: 16px; top: 16px; width: 200px; height: 220px; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  #teleport { position: fixed; right: 16px; top: 248px; width: 200px; max-height: calc(100vh - 380px); overflow-y: auto; display: flex; flex-wrap: wrap; gap: 4px; }
  #teleport button { flex: 1 1 45%; font-size: 12px; padding: 5px 4px; border: 0; border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  #teleport button:hover { background: var(--accent); }
  #flybtns { display: flex; gap: 6px; margin-top: 6px; }
  #flybtns button { flex: 1; padding: 7px 4px; border: 0; border-radius: 8px; background: rgba(255,255,255,.14); color: #fff; font-size: 13px; cursor: pointer; }
  #flybtns button:hover { background: var(--accent); }
  #flydone a { display: block; margin-top: 6px; color: #ffd2c4; }
  #flynote { display: none; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--panel); color: var(--text); padding: 6px 14px; border-radius: 999px; font-size: 13px; }
  #errors { position: fixed; left: 16px; top: 16px; color: #ffb4a8; font-size: 12px; max-width: 40vw; }
  @media (max-width: 640px) {
    #mini { width: 120px; height: 142px; right: 16px; top: 56px; }
    #teleport { display: none; }
    #help { font-size: 12px; max-width: calc(100vw - 32px); box-sizing: border-box; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="room">Участок</div>
  <canvas id="mini" width="400" height="440"></canvas>
  <div id="teleport"></div>
  <div id="errors"></div>
  <div id="help">
    <b>Дом ≈ 624 м²</b> · 2 этажа, 5 спален<br>Бассейн 117 м², хамам, гостиная со вторым светом<br><br>
    <b>WASD</b> — идти, <b>мышь</b> (или перетаскивание) — смотреть, <b>Shift</b> — быстрее, <b>Esc</b> — отпустить мышь.<br>
    На телефоне: левая половина экрана — шаг, правая — взгляд.
    <button id="start">Войти в прогулку</button>
    <div id="flybtns"><button id="fly">Облёт участка</button><button id="flyrec">● Записать видео</button></div>
    <div id="flydone"></div>
  </div>
</div>
